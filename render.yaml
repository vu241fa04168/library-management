databases:
  - name: vignan-db
    databaseName: vignan_library
    user: vignan_admin
    plan: free

services:
  - type: web
    name: vignan-library
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn vignan_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vignan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
